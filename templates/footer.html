{% block content %}
{% load static %}

<!-- ── FOOTER ── -->
<footer style="
  background: rgba(0, 0, 0, 0.4);
  border-top: 1px solid rgba(255,255,255,0.06);
  padding: 40px 40px 24px;
  font-family: 'Inter', sans-serif;
  color: rgba(255,255,255,0.4);
  font-size: 13px;
">
    <div
        style="max-width: 1100px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 20px;">

        <!-- Brand -->
        <div style="display: flex; align-items: center; gap: 10px;">
            <div style="
        width: 32px; height: 32px;
        background: linear-gradient(135deg, #7c3aed, #4f46e5);
        border-radius: 8px;
        display: flex; align-items: center; justify-content: center;
        font-size: 13px; color: #fff;
      "><i class="fa fa-shield-alt"></i></div>
            <span style="color: rgba(255,255,255,0.65); font-weight: 600; font-size: 14px;">DDOS-Attack Detection</span>
        </div>

        <!-- Center text -->
        <p style="margin: 0; text-align: center;">
            &copy; 2025 DDoS Detection System &mdash; AI-powered network security analysis
        </p>

        <!-- Back to top -->
        <a href="#" style="
      display: inline-flex; align-items: center; gap: 6px;
      color: rgba(255,255,255,0.4);
      text-decoration: none;
      font-size: 13px;
      transition: color 0.2s;
    " onmouseover="this.style.color='#a78bfa'" onmouseout="this.style.color='rgba(255,255,255,0.4)'">
            <i class="bi bi-arrow-up-circle"></i> Back to top
        </a>
    </div>
</footer>

<!-- JavaScript Libraries -->
<script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="{% static 'lib/wow/wow.min.js' %}"></script>
<script src="{% static 'lib/easing/easing.min.js' %}"></script>
<script src="{% static 'lib/waypoints/waypoints.min.js' %}"></script>
<script src="{% static 'lib/owlcarousel/owl.carousel.min.js' %}"></script>
<script src="{% static 'js/main.js' %}"></script>
</body>

</html>
{% endblock %}
